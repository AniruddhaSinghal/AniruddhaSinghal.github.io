#lvTitle b{font-size:15px}
#lvTitle small{font-size:11px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
#liveStars span{font-size:15px;color:#f5b301;text-shadow:0 1px 0 #8a5a00;transition:all .3s}

#controls.withpad #actBtns .btn{flex-direction:row;justify-content:center;gap:5px;min-width:0;padding:8px 6px;font-size:16px}
#dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,50px);gap:4px}
#dpad button{border-radius:16px;font-size:22px;background:rgba(255,255,255,.85);border:2px solid rgba(70,30,5,.5);box-shadow:0 4px 0 rgba(0,0,0,.25);color:#5a2a06;font-weight:900}
#dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);background:#ffe1a8}

.sw.on{background:#6fd13f}.sw.on::after{left:26px}
.skinGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
.skin{border:3px solid #b8661b;border-radius:16px;background:#fff;padding:6px;font-weight:800;font-size:13px}
.skin canvas{width:100%;height:56px;display:block}
.skin.sel{border-color:#2f9a14;box-shadow:0 0 0 3px #a6ef6a}

.toast{background:#3a1d0c;color:#fff;padding:9px 16px;border-radius:14px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:tin .35s cubic-bezier(.2,1.6,.4,1);max-width:92vw;text-align:center}

.spinner{width:64px;height:64px;border-radius:50%;border:8px solid rgba(255,255,255,.4);border-top-color:#9df06a;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadTxt{flex-direction:column;text-align:center;max-width:86vw;white-space:normal}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stats div{background:#fff;border:2px solid #e2c9a2;border-radius:12px;padding:6px 4px;font-weight:800;font-size:12px}
.stats div b{display:block;font-size:20px;color:#7a3d0a}
.small-note{font-size:12px;opacity:.85;font-weight:700;text-align:left;line-height:1.4}
@media (max-width:420px){.pill{font-size:12px;padding:5px 6px}#lvTitle b{font-size:13px}.iconbtn{width:38px;height:38px;font-size:18px}#liveStars span{font-size:12px}}
</style>

    var ci=c.indexOf(t);

      var p=py*W+px;

  if(m===L.full&&ns[0]===L.exit)return {st:{s:ns,m:m,c:c},status:3,frames:frames,ate:ate};
  var status=settle(L,ns,m,c,frames);

}
function solve(L,st0,maxNodes){
  var states=[st0],par=[-1],mv=[-1],seen=new Map();seen.set(stKey(st0),0);
  for(var i=0;i<states.length;i++){
    if(states.length>maxNodes)return {ok:false,capped:true,nodes:states.length};
    for(var d=0;d<4;d++){
      var r=step(L,states[i],d,false);
      if(!r||r.status===1||r.status===2)continue;
      if(r.status===3){var path=[d],j=i;while(j>0){path.push(mv[j]);j=par[j];}path.reverse();return {ok:true,path:path,nodes:states.length};}
      var k=stKey(r.st);
      if(!seen.has(k)){seen.set(k,states.length);states.push(r.st);par.push(i);mv.push(d);}
    }

}
function finalize(L){var N=L.W*L.H;L.appleAt=new Int16Array(N).fill(-1);for(var i=0;i<L.apples.length;i++)L.appleAt[L.apples[i]]=i;L.full=(1<<L.apples.length)-1;return L;}

/* compact storage: only the core region is stored, margins are open sky */
function packLevel(L,meta){

}
function unpackLevel(o){
  var g=new Uint8Array(o.W*o.H);
  for(var y=0;y<o.ch;y++)for(var x=0;x<o.cw;x++)g[(y+o.mt)*o.W+x+o.ml]=+o.g[y*o.cw+x];

  L.par=o.par;L.sol=typeof o.sol==='string'?o.sol.split('').map(Number):o.sol;L.info=o.info||{};return L;
}

<script id="gen">
/* ===== LEVEL ANALYSIS + EVOLUTIONARY GENERATOR ===== */
/* Explores the complete state graph and measures what makes a gravity-snake level hard:
   - eat-traps: (apple-set, apple) pairs where eating that apple from a winnable state makes the level unwinnable
   - order ratio: share of reachable apple-sets that can still win
   - greedy failure: does "always eat the nearest apple" lose?
   - path deaths/traps: lethal falls and dead-end moves adjacent to the optimal route */
function analyzeLevel(L,cap){
  var st0=initialState(L);if(!st0)return null;
  var states=[st0],masks=[0],seen=new Map(),E=[],i,d,r,v,k;seen.set(stKey(st0),0);
  for(i=0;i<states.length;i++){
    if(states.length>cap)return {capped:true,N:states.length};
    for(d=0;d<4;d++){
      r=step(L,states[i],d,false);
      if(!r)v=-1;else if(r.status===1||r.status===2)v=-2;else if(r.status===3)v=-3;
      else{k=stKey(r.st);v=seen.get(k);if(v===undefined){v=states.length;seen.set(k,v);states.push(r.st);masks.push(r.st.m);}}
      E.push(v);
    }
  }
  var N=states.length,cnt=new Int32Array(N+1);
  for(i=0;i<N*4;i++)if(E[i]>=0)cnt[E[i]+1]++;
  for(i=0;i<N;i++)cnt[i+1]+=cnt[i];
  var rev=new Int32Array(cnt[N]),pos=cnt.slice(0,N);
  for(i=0;i<N;i++)for(d=0;d<4;d++){v=E[i*4+d];if(v>=0)rev[pos[v]++]=i;}
  var dist=new Int32Array(N).fill(-1),q=[];
  for(i=0;i<N;i++)for(d=0;d<4;d++)if(E[i*4+d]===-3){dist[i]=1;q.push(i);break;}
  for(var h=0;h<q.length;h++){v=q[h];for(var j=cnt[v];j<cnt[v+1];j++){var u=rev[j];if(dist[u]<0){dist[u]=dist[v]+1;q.push(u);}}}
  if(dist[0]<0)return {ok:false,N:N};
  var reach={},win={},nR=0,nW=0,dead=0,trapPairs={},nTrap=0;
  for(i=0;i<N;i++){var mm=masks[i];if(!reach[mm]){reach[mm]=1;nR++;}if(dist[i]>=0){if(!win[mm]){win[mm]=1;nW++;}}else dead++;
    if(dist[i]>=0)for(d=0;d<4;d++){v=E[i*4+d];if(v>=0&&masks[v]!==mm&&dist[v]<0){var key=mm+'_'+masks[v];if(!trapPairs[key]){trapPairs[key]=1;nTrap++;}}}}

    for(d=0;d<4;d++){v=E[cur*4+d];if(v===-3&&dist[cur]===1){nxt=-3;nd=d;}else if(v>=0&&nxt===-1&&dist[v]===dist[cur]-1){nxt=v;nd=d;}}
    for(d=0;d<4;d++){v=E[cur*4+d];if(v===-2)pDeaths++;else if(v>=0&&dist[v]<0)pTraps++;}
    path.push(nd);if(nxt===-3)break;cur=nxt;}

  var gcur=0,greedyFail=false,full=L.full;
  while(masks[gcur]!==full){
    var bq=[gcur],bs={},found=-1;bs[gcur]=1;
    for(var bh=0;bh<bq.length&&found<0;bh++){var x=bq[bh];for(d=0;d<4;d++){v=E[x*4+d];if(v<0||bs[v])continue;bs[v]=1;if(masks[v]!==masks[gcur]){found=v;break;}bq.push(v);}}
    if(found<0){greedyFail=true;break;}gcur=found;}
  if(!greedyFail&&dist[gcur]<0)greedyFail=true;
  var rho=nW/nR,df=dead/N;
  var H=0.5*dist[0]+5*Math.min(nTrap,14)+2*pTraps+1.5*pDeaths+25*(1-rho)+12*df+Math.min(13,Math.log2(N))+(greedyFail?18:0);
  return {ok:true,N:N,opt:dist[0],eatTraps:nTrap,rho:rho,deadFrac:df,pTraps:pTraps,pDeaths:pDeaths,greedyFail:greedyFail,path:path,H:H};
}

function tierOf(n){
  var t=Math.max(0,Math.min(1,(n-1)/999)),g=(n-1)%10,boss=n%10===0;
  var tb=Math.min(1,t+(boss?0.06:0));
  var apples=Math.min(8,2+Math.round(tb*6+(n>3?0.6:0)));
  return {t:t,boss:boss,
    cw:Math.round(12+tb*10),ch:Math.round(9+tb*5),apples:apples,
    islands:4+Math.round(tb*6),
    spikes:n<8?0:Math.round(1+tb*7),
    crates:0,
    cap:25000+Math.round(tb*60000),
    needTraps:n<=2?0:n<=12?1:1+Math.floor(tb*5),
    needGreedy:n>=4,
    iters:30+Math.round(tb*40),
    minOpt:10+Math.round(tb*40),maxOpt:n<=3?18:n<=10?30:0,
    budget:Math.round(6000+tb*24000)};
}
function buildFrame(T){
  var maxLen=3+T.apples,ml=maxLen+1,mt=maxLen,mb=maxLen;
  return {W:T.cw+2*ml,H:T.ch+mt+mb,cw:T.cw,ch:T.ch,ml:ml,mt:mt};
}
function gSeed(R,T,F){
  var cw=T.cw,ch=T.ch,core=new Uint8Array(cw*ch),i,x,y,a,b;
  var ri=function(a,b){return a+Math.floor(R()*(b-a+1));};
  var sy=ri(Math.floor(ch*0.45),ch-2),sw=ri(3,5);
  for(x=0;x<sw;x++)core[(sy+1)*cw+x]=1;
  if(R()<0.5)for(y=sy+2;y<ch&&y<sy+2+ri(0,3);y++)core[y*cw+ri(0,sw-1)]=1;
  for(i=0;i<T.islands;i++){
    var w=ri(1,3),hh=R()<0.2?2:1,xx=ri(0,cw-w),yy=ri(1,ch-hh);
    if(xx<sw+1&&Math.abs(yy-sy)<=1)continue;
    for(a=0;a<w;a++)for(b=0;b<hh;b++)core[(yy+b)*cw+xx+a]=1;
    if(R()<0.2&&yy+hh<ch-1)for(b=hh;b<hh+ri(1,3)&&yy+b<ch;b++)core[(yy+b)*cw+xx+(R()<0.5?0:w-1)]=1;
  }
  for(x=0;x<3;x++){core[sy*cw+x]=0;if(sy>0)core[(sy-1)*cw+x]=0;}
  var used={};for(x=0;x<3;x++)used[sy*cw+x]=1;
  var air=function(p){return core[p]===0&&!used[p];};
  var below=function(p){var d=0,q=p+cw;while(q<cw*ch&&core[q]===0){d++;q+=cw;}return q>=cw*ch?99:d;};
  var pick=function(wf){var tot=0,ws=[];for(var p=0;p<cw*ch;p++){var w=air(p)?wf(p):0;ws.push(w);tot+=w;}
    if(tot<=0)return -1;var r=R()*tot;for(p=0;p<cw*ch;p++){r-=ws[p];if(r<=0)return p;}return -1;};
  var near=function(p,r){var px=p%cw,py=(p/cw)|0;return Math.abs(px-1)+Math.abs(py-sy)<=r;};
  var apples=[];
  var nA=T.seedApples||T.apples;
  for(i=0;i<nA;i++){var ap=pick(function(p){if(near(p,1))return 0;var d=below(p);return d===0?2.2:d<=2?1.6:d<=4?0.9:0.35;});
    if(ap<0)return null;apples.push(ap);used[ap]=1;}
  var exit=pick(function(p){if(near(p,4))return 0;var px=p%cw,py=(p/cw)|0,d=below(p);return (1+px/cw*2)*(1+(ch-py)/ch)*(d<=3?1.5:0.6);});
  if(exit<0)return null;used[exit]=1;
  for(i=0;i<T.spikes;i++){var sp=pick(function(p){if(near(p,2))return 0;var px=p%cw,py=(p/cw)|0;
      var adj=(py<ch-1&&core[p+cw]===1)||(py>0&&core[p-cw]===1);return adj?2:py>=ch-2?1:0.3;});
    if(sp>=0){core[sp]=2;used[sp]=1;}}
  var crates=[];for(i=0;i<T.crates;i++){var cp=pick(function(p){return (!near(p,1)&&(p/cw|0)<ch-1&&core[p+cw]===1)?1:0;});if(cp>=0){crates.push(cp);used[cp]=1;}}
  return toLevel(F,core,apples,exit,[sy*cw+2,sy*cw+1,sy*cw],crates);
}
function toLevel(F,core,apples,exit,snake,crates){
  var g=new Uint8Array(F.W*F.H),cw=F.cw,f=function(p){return ((p/cw|0)+F.mt)*F.W+(p%cw)+F.ml;};
  for(var p=0;p<core.length;p++)if(core[p])g[f(p)]=core[p];
  var L=finalize({W:F.W,H:F.H,cw:F.cw,ch:F.ch,ml:F.ml,mt:F.mt,grid:g,apples:apples.map(f),exit:f(exit),snake:snake.map(f),crates:crates.map(f).sort(function(a,b){return a-b;})});
  L.core={g:core,apples:apples,exit:exit,snake:snake,crates:crates};return L;
}
function gMutate(R,L,T,F){
  var C=L.core,core=C.g.slice(),apples=C.apples.slice(),exit=C.exit,crates=C.crates.slice(),cw=F.cw,N=core.length;
  var ri=function(a,b){return a+Math.floor(R()*(b-a+1));};
  var occ={};C.snake.concat(apples,[exit],crates).forEach(function(p){occ[p]=1;});
  var sh=C.snake[0];occ[sh-cw]=occ[sh-cw-1]=occ[sh-cw-2]=1;occ[sh+cw]=occ[sh+cw-1]=occ[sh+cw-2]=1;
  if(apples.length<T.apples&&R()<0.5){
    for(var tr=0;tr<30;tr++){var pa=ri(0,N-1);if(core[pa]===0&&!occ[pa]){apples.push(pa);occ[pa]=1;break;}}
    return toLevel(F,core,apples,exit,C.snake,crates);
  }
  var n=1+(R()<0.45?1:0)+(R()<0.15?2:0);
  for(var k=0;k<n;k++){
    var op=R(),p=ri(0,N-1),i;
    if(op<0.40){if(!occ[p]&&core[p]!==2)core[p]=core[p]?0:1;}
    else if(op<0.50){var w=ri(2,3),q=p-(p%cw)+Math.min(p%cw,cw-w),ok=true;for(i=0;i<w;i++)if(occ[q+i])ok=false;if(ok)for(i=0;i<w;i++)core[q+i]=core[q+i]?0:1;}
    else if(op<0.72){if(core[p]===0&&!occ[p]){i=ri(0,apples.length-1);delete occ[apples[i]];apples[i]=p;occ[p]=1;}}
    else if(op<0.80){if(core[p]===0&&!occ[p]){delete occ[exit];exit=p;occ[p]=1;}}
    else if(op<0.92){if(!occ[p]){if(core[p]===2)core[p]=0;else if(T.spikes>0)core[p]=2;}}

}
function wallPen(L){var g=L.core.g,cw=L.cw,n=g.length,w=0,iso=0;for(var p=0;p<n;p++)if(g[p]===1){w++;var x=p%cw;
  if(!(x>0&&g[p-1]===1)&&!(x<cw-1&&g[p+1]===1)&&!(p>=cw&&g[p-cw]===1)&&!(p+cw<n&&g[p+cw]===1))iso++;}return 0.12*w+0.5*iso;}
function fitness(A,T,L){
  var pen=(L?wallPen(L)+30*(T.apples-L.apples.length):0)+20*Math.max(0,T.needTraps-A.eatTraps)+(T.needGreedy&&!A.greedyFail?15:0)+1.5*Math.max(0,T.minOpt-A.opt)+(T.maxOpt?2*Math.max(0,A.opt-T.maxOpt):0);
  return A.H-pen;
}
function generateLevel(n,seed,opts){
  opts=opts||{};var T=tierOf(n),F=buildFrame(T),R=mulberry32(seed||((n*2654435761)>>>0^0x51ED));
  T.seedApples=Math.max(2,Math.ceil(T.apples*0.5));
  var t0=Date.now(),budget=opts.budget||T.budget,best=null,bA=null,bF=-1e9,tries=0;
  while(tries<400&&(!best||tries<6)&&Date.now()-t0<budget*0.5){
    tries++;var L=gSeed(R,T,F);if(!L)continue;var A=analyzeLevel(L,Math.min(T.cap,25000));
    if(!A||!A.ok)continue;var f=fitness(A,T,L);if(f>bF){bF=f;best=L;bA=A;}
  }
  if(!best)return null;
  var stale=0;
  for(var it=0;it<T.iters*3;it++){
    if(it>=T.iters&&best.apples.length>=T.apples&&bA.eatTraps>=T.needTraps&&(bA.greedyFail||!T.needGreedy))break;
    if(Date.now()-t0>budget)break;
    var M=gMutate(R,best,T,F),B=analyzeLevel(M,T.cap);
    if(!B||!B.ok)continue;var fb=fitness(B,T,M);
    if(fb>=bF){if(fb>bF+0.01)stale=0;else stale++;best=M;bA=B;bF=fb;}else stale++;
    if(stale>40)break;
  }

  return {L:best,A:bA,T:T};
}
function generatePacked(n,seed,opts){
  var r=generateLevel(n,seed,opts);if(!r)return null;var A=r.A;
  return packLevel(r.L,{n:n,par:A.opt,sol:A.path.join(''),info:{traps:A.eatTraps,greedy:A.greedyFail?1:0,order:Math.round((1-A.rho)*100),deaths:A.pDeaths,states:A.N,boss:r.T.boss?1:0}});
}

<script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const TOTAL=1000,LKEY='sp3_lv_',SAVE_KEY='snakepuzzle_sky_v3';
let DPR=1,VW=0,VH=0;

/* ================= COOKIES & STORAGE ================= */
function setCookie(name, val, days) {
  try {
    const d = new Date();
    d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
    const expires = 'expires=' + d.toUTCString();
    document.cookie = name + '=' + val + ';' + expires + ';path=/;SameSite=Lax';
  } catch(e) {}
}

function getCookie(name) {
  try {
    const nameEQ = name + '=';
    const ca = document.cookie.split(';');
    for (let i = 0; i < ca.length; i++) {
      let c = ca[i];
      while (c.charAt(0) === ' ') c = c.substring(1, c.length);
      if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
    }
  } catch(e) {}
  return null;
}

function eraseCookie(name) {
  try {
    document.cookie = name + '=; Max-Age=-99999999; path=/; SameSite=Lax';
  } catch(e) {}
}

function saveCookieData(key, rawStr, days = 365) {
  try {
    const encoded = encodeURIComponent(rawStr);
    const CHUNK_SIZE = 3000;
    const totalChunks = Math.ceil(encoded.length / CHUNK_SIZE);
    const oldChunks = parseInt(getCookie(key + '_chunks') || '0', 10);

    if (totalChunks <= 1) {
      setCookie(key, encoded, days);
      eraseCookie(key + '_chunks');
      for (let i = 0; i < oldChunks; i++) eraseCookie(key + '_c' + i);
    } else {
      setCookie(key + '_chunks', String(totalChunks), days);
      for (let i = 0; i < totalChunks; i++) {
        setCookie(key + '_c' + i, encoded.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE), days);
      }
      for (let i = totalChunks; i < oldChunks; i++) eraseCookie(key + '_c' + i);
      setCookie(key, 'CHUNKED', days);
    }
  } catch(e) {}
}

function loadCookieData(key) {
  try {
    const main = getCookie(key);
    if (!main) {
      const chunks = parseInt(getCookie(key + '_chunks') || '0', 10);
      if (chunks > 0) {
        let joined = '';
        for (let i = 0; i < chunks; i++) {
          const part = getCookie(key + '_c' + i);
          if (part) joined += part;
        }
        return joined ? decodeURIComponent(joined) : null;
      }
      return null;
    }
    if (main === 'CHUNKED') {
      const chunks = parseInt(getCookie(key + '_chunks') || '0', 10);
      let joined = '';
      for (let i = 0; i < chunks; i++) {
        const part = getCookie(key + '_c' + i);
        if (part) joined += part;
      }
      return joined ? decodeURIComponent(joined) : null;
    }
    return decodeURIComponent(main);
  } catch(e) {}
  return null;
}

/* ================= SAVE ================= */
const defSave=()=>({unlocked:1,stars:{},best:{},skipped:{},coins:60,skin:0,ach:{},
  stats:{eaten:0,falls:0,spikes:0,undos:0,hints:0,clears:0,nohintRun:0,nohintBest:0,boss:0,perfect:0},
  daily:{last:'',streak:0,best:0,done:{}},freeHints:3,seen:{},
  settings:{sound:true,dpad:isTouch,deadend:false,vibe:true,grid:true}});
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')merge(a[k],b[k]);else a[k]=b[k];}return a;}

let S=(()=>{
  let localObj = null, cookieObj = null;
  try {
    const l = localStorage.getItem(SAVE_KEY);
    if (l) localObj = JSON.parse(l);
  } catch(e) {}
  try {
    const c = loadCookieData(SAVE_KEY);
    if (c) cookieObj = JSON.parse(c);
  } catch(e) {}

  if (localObj && cookieObj) {
    const scoreL = (localObj.unlocked || 1) * 1000 + Object.keys(localObj.stars || {}).length;
    const scoreC = (cookieObj.unlocked || 1) * 1000 + Object.keys(cookieObj.stars || {}).length;
    const base = scoreC > scoreL ? merge(localObj, cookieObj) : merge(cookieObj, localObj);
    return merge(defSave(), base);
  } else if (cookieObj) {
    return merge(defSave(), cookieObj);
  } else if (localObj) {
    return merge(defSave(), localObj);
  }
  return defSave();
})();

function save(){
  try {
    const str = JSON.stringify(S);
    try { localStorage.setItem(SAVE_KEY, str); } catch(e) {}
    try { saveCookieData(SAVE_KEY, str); } catch(e) {}
  } catch(e) {}
}
// Sync to both localStorage and cookies immediately on launch
save();
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);

/* ================= AUDIO ================= */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type,vol,slide,delay){if(!S.settings.sound)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);}

const WORKER_TAIL=`onmessage=function(e){var d=e.data,r={id:d.id};try{if(d.type==='gen'){r.level=generatePacked(d.n,d.seed,d.opts||{});}else{r.res=solve(unpackLevel(d.level),d.st,d.cap);}}catch(err){r.err=String(err&&err.stack||err);}postMessage(r);};`;
function mkWorker(){try{const src=$('core').textContent+'\n'+$('gen').textContent+'\n'+WORKER_TAIL;const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));w.pend=new Map();
  w.onmessage=e=>{const p=w.pend.get(e.data.id);if(p){w.pend.delete(e.data.id);p(e.data);}};return w;}catch(e){return null;}}
const genW=mkWorker(),solW=mkWorker();let wid=0;
function call(w,msg){return new Promise(res=>{
  const local=()=>setTimeout(()=>{const r={};try{if(msg.type==='gen')r.level=generatePacked(msg.n,msg.seed,msg.opts||{});else r.res=solve(unpackLevel(msg.level),msg.st,Math.min(msg.cap,80000));}catch(e){r.err=String(e);}res(r);},20);
  if(!w)return local();msg.id=++wid;w.pend.set(msg.id,res);try{w.postMessage(msg);}catch(e){w.pend.delete(msg.id);local();}});}
const mem=new Map(),inflight=new Map();
function cachedLevel(n){if(mem.has(n))return mem.get(n);if(window.PREBAKED&&window.PREBAKED[n]){mem.set(n,window.PREBAKED[n]);return window.PREBAKED[n];}try{const s=localStorage.getItem(LKEY+n);if(s){const o=JSON.parse(s);mem.set(n,o);return o;}}catch(e){}return null;}
function getLevel(n){
  const c=cachedLevel(n);if(c)return Promise.resolve(c);
  if(inflight.has(n))return inflight.get(n);
  const p=call(genW,{type:'gen',n:n}).then(r=>{inflight.delete(n);if(!r.level)throw new Error(r.err||'generation failed');
    mem.set(n,r.level);try{localStorage.setItem(LKEY+n,JSON.stringify(r.level));}catch(e){}return r.level;});
  inflight.set(n,p);return p;}
function prefetch(n){let chain=Promise.resolve();for(let k=1;k<=2;k++){const q=n+k;if(q<=TOTAL&&!cachedLevel(q))chain=chain.then(()=>getLevel(q)).catch(()=>{});}}
function solveAsync(packed,st,cap){return call(solW,{type:'solve',level:packed,st:st,cap:cap});}

function computeArea(){
  const hud=$('hud'),con=$('controls');
  let top=hud.classList.contains('hidden')?0:hud.getBoundingClientRect().bottom+4;
  let bottom=con.classList.contains('hidden')?VH:con.getBoundingClientRect().top-4;
  let left=0,right=VW;
  if(con.classList.contains('withpad')&&VW>VH&&VH<=520){bottom=VH-6;left=170;right=VW-190;}
  G.area={l:left,t:top,w:Math.max(50,right-left),h:Math.max(50,bottom-top)};
}
function contentBox(){
  const L=G.L,W=L.W;let x0=L.ml-1,y0=L.mt-1,x1=L.ml+L.cw+1,y1=L.mt+L.ch+1;
  const s=(G.anim&&G.anim.frames[G.anim.i])?G.anim.frames[G.anim.i].s:G.st.s;
  if(G.status!==1)for(const p of s){const x=p%W,y=(p/W)|0;x0=Math.min(x0,x-1);x1=Math.max(x1,x+2);y0=Math.min(y0,y-1);y1=Math.max(y1,y+2);}
  return {x0,y0,x1,y1};
}
function minTs(){return Math.min(VW,VH)<600?30:34;}
function camTarget(){
  const b=contentBox(),A=G.area,bw=b.x1-b.x0,bh=b.y1-b.y0;
  const fit=Math.min(A.w/bw,A.h/bh);
  let ts,cx,cy;
  if(G.overview||fit>=minTs()){ts=Math.min(fit,76);cx=(b.x0+b.x1)/2;cy=(b.y0+b.y1)/2;}
  else{ts=minTs();const h=G.st.s[0],W=G.L.W;cx=(h%W)+0.5;cy=((h/W)|0)+0.5;
    const hw=A.w/ts/2,hh=A.h/ts/2;
    cx=bw/2<=hw?(b.x0+b.x1)/2:Math.max(b.x0+hw,Math.min(b.x1-hw,cx));
    cy=bh/2<=hh?(b.y0+b.y1)/2:Math.max(b.y0+hh,Math.min(b.y1-hh,cy));}
  G.camT={x:cx,y:cy,ts:ts};return fit;
}
function layout(snap){
  DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);buildBg();
  if(!G.L)return;computeArea();const fit=camTarget();
  $('bMap').classList.toggle('hidden',fit>=minTs());
  if(snap)G.cam=Object.assign({},G.camT);
}
function updCam(dt){if(!G.L)return;camTarget();const k=1-Math.exp(-dt/140);const c=G.cam,t=G.camT;c.x+=(t.x-c.x)*k;c.y+=(t.y-c.y)*k;c.ts+=(t.ts-c.ts)*k;}

let bgC=document.createElement('canvas'),bgTheme=null,clouds=[];
function buildBg(){
  const T=G.theme;bgTheme=T;bgC.width=cv.width;bgC.height=cv.height;const b=bgC.getContext('2d');const w=bgC.width,h=bgC.height;
  const gr=b.createLinearGradient(0,0,0,h);gr.addColorStop(0,T.sky[0]);gr.addColorStop(1,T.sky[1]);b.fillStyle=gr;b.fillRect(0,0,w,h);
  const rnd=mulberry32(hashStr(T.name));
  if(T.stars){for(let i=0;i<160;i++){b.fillStyle=`rgba(255,255,255,${0.3+rnd()*0.7})`;const s=rnd()*2*DPR+0.5;b.fillRect(rnd()*w,rnd()*h*0.7,s,s);}}
  const sx=w*0.78,sy=h*0.2,sr=Math.min(w,h)*0.09;
  const sg=b.createRadialGradient(sx,sy,sr*0.2,sx,sy,sr*3);sg.addColorStop(0,T.sun);sg.addColorStop(0.35,T.sun+'88');sg.addColorStop(1,T.sun+'00');
  b.fillStyle=sg;b.fillRect(0,0,w,h);b.fillStyle=T.sun;b.beginPath();b.arc(sx,sy,sr,0,7);b.fill();
  for(let layer=0;layer<2;layer++){b.fillStyle=T.sil[layer];b.globalAlpha=layer?0.9:0.7;drawSil(b,T.type,w,h,layer,rnd);}
  b.globalAlpha=1;
  clouds=[];for(let i=0;i<7;i++)clouds.push({x:rnd()*VW,y:rnd()*VH*0.6,s:0.6+rnd()*0.9,v:4+rnd()*8});
}
function drawSil(b,type,w,h,layer,rnd){
  const base=h*(layer?0.95:0.88),sc=Math.min(w,h)*(layer?0.2:0.14);
  b.beginPath();b.moveTo(0,h);
  if(type==='dunes'||type==='islands'||type==='clouds'){
    for(let x=0;x<=w;x+=8){b.lineTo(x,base-Math.sin(x/w*Math.PI*(2+layer)+layer*2)*sc*0.45-Math.sin(x/w*13)*sc*0.06);}b.lineTo(w,h);b.fill();
    if(type==='clouds'){for(let i=0;i<9;i++){const x=rnd()*w,y=base-sc*0.2,r=sc*(0.3+rnd()*0.4);b.beginPath();b.arc(x,y,r,0,7);b.fill();}}
    return;}
  b.lineTo(0,base);b.lineTo(w,base);b.lineTo(w,h);b.fill();
  const n=layer?5:8;
  for(let i=0;i<n;i++){
    const x=(i+0.5)/n*w+(rnd()-0.5)*w/n*0.6,s=sc*(0.7+rnd()*0.6);
    b.beginPath();
    if(type==='pagoda'){const tiers=3+Math.floor(rnd()*3);let y=base,wd=s*0.9;b.rect(x-wd*0.35,y-s*0.3,wd*0.7,s*0.3);
      for(let t=0;t<tiers;t++){const th=s*0.28;y-=s*0.3;b.moveTo(x-wd*0.62,y);b.quadraticCurveTo(x-wd*0.3,y-th*0.2,x-wd*0.3,y-th*0.6);b.lineTo(x+wd*0.3,y-th*0.6);b.quadraticCurveTo(x+wd*0.3,y-th*0.2,x+wd*0.62,y);b.closePath();b.rect(x-wd*0.28,y-th*0.6-s*0.12,wd*0.56,s*0.14);y-=th*0.6;wd*=0.78;}
      b.rect(x-s*0.02,y-s*0.35,s*0.04,s*0.35);}
    else if(type==='bamboo'){for(let k=0;k<4;k++){const bx=x+k*s*0.18,hh=s*(1.6+rnd()*1.4);b.rect(bx,base-hh,s*0.08,hh);for(let j=1;j<6;j++)b.rect(bx-s*0.015,base-hh*j/6,s*0.11,s*0.025);}}
    else if(type==='peaks'){b.moveTo(x-s*1.2,base);b.lineTo(x,base-s*1.6);b.lineTo(x+s*1.2,base);}
    else if(type==='volcano'){b.moveTo(x-s*1.3,base);b.lineTo(x-s*0.3,base-s*1.2);b.lineTo(x+s*0.3,base-s*1.2);b.lineTo(x+s*1.3,base);}
    else if(type==='pines'){b.rect(x-s*0.05,base-s*0.4,s*0.1,s*0.4);for(let t=0;t<3;t++){const y=base-s*0.3-t*s*0.4;b.moveTo(x-s*(0.5-t*0.1),y);b.lineTo(x,y-s*0.6);b.lineTo(x+s*(0.5-t*0.1),y);}}
    else if(type==='city'){const bw=s*0.55,bh=s*(1+rnd()*2);b.rect(x-bw/2,base-bh,bw,bh);}
    else if(type==='castle'){b.rect(x-s*0.4,base-s*0.9,s*0.8,s*0.9);b.moveTo(x+s*0.45,base-s*0.9);b.arc(x,base-s*0.9,s*0.45,0,Math.PI,true);b.rect(x-s*0.03,base-s*1.65,s*0.06,s*0.35);}
    b.fill();
    if(type==='city'&&layer===1){b.save();b.fillStyle='rgba(255,230,120,.55)';for(let k=0;k<10;k++)b.fillRect(x-s*0.2+rnd()*s*0.35,base-rnd()*s*1.4,s*0.06,s*0.06);b.restore();}
  }
}
function drawClouds(dt){
  ctx.save();ctx.fillStyle=G.theme.stars?'rgba(255,255,255,.08)':'rgba(255,255,255,.5)';
  for(const c of clouds){c.x+=c.v*dt/1000;if(c.x>VW+120)c.x=-120;const s=c.s*40;
    ctx.beginPath();ctx.arc(c.x,c.y,s,0,7);ctx.arc(c.x+s*0.9,c.y+s*0.2,s*0.75,0,7);ctx.arc(c.x-s*0.9,c.y+s*0.25,s*0.65,0,7);ctx.arc(c.x+s*0.2,c.y-s*0.45,s*0.7,0,7);ctx.fill();}

function ease(k){return k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}
function interpPts(a,b,k){const out=[];for(let i=0;i<b.s.length;i++){const from=i<a.s.length?a.s[i]:a.s[a.s.length-1];const[x0,y0]=cxy(from),[x1,y1]=cxy(b.s[i]);out.push([lerp(x0,x1,k),lerp(y0,y1,k)]);}return out;}

function skinsModal(){
  const ts0=totalStars();
  openModal(`<div class="card"><h2>🎨 Skins</h2><p>Earn ⭐ to unlock new looks · you have <b>${ts0}</b>⭐</p><div class="skinGrid">${SKINS.map((k,i)=>`<div class="skin ${ts0>=k.need?'':'lockd'} ${S.skin===i?'sel':''}" data-i="${i}"><canvas width="220" height="112"></canvas>${k.name}<br><small>${ts0>=k.need?(S.skin===i?'✓ equipped':'tap to equip'):'🔒 '+k.need+'⭐'}</small></div>`).join('')}</div><div class="row"><button class="btn green" id="skOk">Done</button></div></div>`);
  document.querySelectorAll('.skin').forEach(el=>{const i=+el.dataset.i,c=el.querySelector('canvas').getContext('2d');
    drawSnakeAt(c,[[170,50],[130,50],[90,50],[90,80],[50,80]],44,SKINS[i],{facing:1});
    el.onclick=()=>{if(ts0<SKINS[i].need){SFX.bump();toast(`Need ${SKINS[i].need}⭐`);return;}S.skin=i;save();SFX.click();skinsModal();};});
  $('skOk').onclick=()=>{SFX.click();closeModal();};
}
function achModal(){
  openModal(`<div class="card"><h2>🏆 Awards</h2><p>${Object.keys(S.ach).length}/${ACH.length} unlocked</p><div class="achList">${ACH.map(a=>{const v=Math.min(a.goal,a.val()),d=!!S.ach[a.id];
    return `<div class="ach ${d?'done':'notyet'}"><div class="ic">${a.ic}</div><div style="flex:1"><b>${a.name} ${d?'✓':''}</b><small>${a.desc} · +${a.r}🪙</small>${d?'':`<div class="bar"><i style="width:${v/a.goal*100}%"></i></div>`}</div></div>`;}).join('')}</div><div class="row"><button class="btn green" id="aOk">Done</button></div></div>`);
  $('aOk').onclick=()=>{SFX.click();closeModal();};
}
function toggleMap(){if(G.mode!=='play')return;G.overview=!G.overview;SFX.click();updateHUD();}

/* ================= INPUT ================= */
const KEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{ac();
  if($('modalRoot').children.length){if(e.code==='Enter'||e.code==='Space'){const b=$('wNext')||$('tipOk')||$('wHome');if(b){e.preventDefault();b.click();}}else if(e.code==='Escape'&&!$('wNext'))closeModal();return;}
  if(G.mode!=='play')return;
  if(e.code in KEYS){e.preventDefault();doMove(KEYS[e.code]);}
  else if(e.code==='KeyZ'||e.code==='Backspace'||e.code==='KeyU'){e.preventDefault();undo();}
  else if(e.code==='KeyR')resetLevel();
  else if(e.code==='KeyH')hint();
  else if(e.code==='KeyM')toggleMap();
  else if(e.code==='Escape')pauseMenu();
});
let sw=null;
cv.addEventListener('pointerdown',e=>{ac();if(G.mode!=='play')return;sw={x:e.clientX,y:e.clientY,id:e.pointerId};});
cv.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,th=Math.max(22,Math.min(40,G.cam.ts*0.55));
  if(Math.max(Math.abs(dx),Math.abs(dy))>th){const d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);doMove(d);sw.x=e.clientX;sw.y=e.clientY;}});
const endSw=()=>{sw=null;};cv.addEventListener('pointerup',endSw);cv.addEventListener('pointercancel',endSw);
document.querySelectorAll('#dpad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();ac();doMove(+b.dataset.d);}));
$('bUndo').onclick=()=>undo();$('bRestart').onclick=()=>resetLevel();$('bHint').onclick=()=>hint();$('bMap').onclick=()=>toggleMap();
$('bDeadUndo').onclick=()=>undo();$('bDeadRestart').onclick=()=>resetLevel();$('stuckPill').onclick=()=>undo();
$('bBackLab').onclick=()=>{SFX.click();};
$('bMenu').onclick=()=>{SFX.click();pauseMenu();};
$('bPlay').onclick=()=>{ac();SFX.click();startLevel(Math.min(S.unlocked,TOTAL));};
$('bLevels').onclick=()=>{ac();SFX.click();showLevels(worldOf(Math.min(S.unlocked,TOTAL)));};
$('bDaily').onclick=()=>{ac();SFX.click();startDaily();};
$('bSkins').onclick=()=>{ac();SFX.click();skinsModal();};
$('bAch').onclick=()=>{ac();SFX.click();achModal();};
$('bSettings').onclick=()=>{ac();SFX.click();settings();};
$('bLvBack').onclick=()=>{SFX.click();showHome();};
$('bWPrev').onclick=()=>{SFX.click();showLevels(curWorld-1);};
$('bWNext').onclick=()=>{SFX.click();showLevels(curWorld+1);};
addEventListener('resize',()=>layout(false));
document.addEventListener('gesturestart',e=>e.preventDefault());
layout(true);showHome();requestAnimationFrame(loop);
window.__api={startLevel,doMove,undo,hint,S,G,showLevels,showHome,startDaily,getLevel,toggleMap};
})();

</script>
</body>
</html>
