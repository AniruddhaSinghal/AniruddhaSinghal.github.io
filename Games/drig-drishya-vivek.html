<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>दृग्-दृश्य · तीरों की मुक्ति · भाग २</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffcf6e;--saffron:#ff9d3c;--ink:#0b0820;--teal:#5fe0cf;--rose:#ff7d8c;--text:#fff4df;--muted:#e2d6f2;
  --serif:'Tiro Devanagari Hindi','Noto Serif Devanagari','Mangal',serif;--sans:'Noto Sans Devanagari','Mangal','Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:20px;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hidden{display:none!important}
button{font-family:var(--sans);cursor:pointer;border:none;color:var(--text)}
/* HUD */
#hudTop{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;display:flex;align-items:center;gap:8px;z-index:5;background:linear-gradient(#0b0820ee,#0b082000)}
.iconBtn{min-width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid rgba(255,207,110,.45);font-size:24px;display:grid;place-items:center}
.iconBtn:active{transform:scale(.93)}
#lvlTitle{flex:1;min-width:0;text-align:center;line-height:1.2}
#lvlTitle .ch{font-family:var(--serif);font-size:24px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvlTitle .sub{font-size:16px;color:var(--muted)}
#lives{font-size:24px;letter-spacing:2px;white-space:nowrap}
.diya.out{filter:grayscale(1) brightness(.4);opacity:.4}
#progress{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 72px);height:8px;border-radius:6px;background:rgba(255,255,255,.1);z-index:5;overflow:hidden}
#progress>div{height:100%;width:0;background:linear-gradient(90deg,#ff9d3c,#ffe08a);transition:width .4s}
#hudBot{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:flex-end;justify-content:space-around;gap:4px;z-index:5;background:linear-gradient(#0b082000,#0b0820f0)}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;color:var(--muted)}
#ramBtn{width:84px;height:84px;border-radius:50%;font-family:var(--serif);font-size:34px;color:#2a1400;background:radial-gradient(circle at 40% 35%,#ffe7a8,#ff9d3c);border:3px solid #fff1c4;box-shadow:0 0 26px #ff9d3c88;position:relative}
#ramBtn svg{position:absolute;inset:-7px;width:98px;height:98px;transform:rotate(-90deg);pointer-events:none}
#micBtn.on{background:rgba(255,157,60,.35);border-color:var(--saffron);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff9d3c88}50%{box-shadow:0 0 0 12px #ff9d3c00}}
#japCount{font-family:var(--serif);color:var(--gold);font-size:18px}
#zoomBox{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 92px);display:flex;flex-direction:column;gap:8px;z-index:5}
#zoomBox .iconBtn{font-size:26px;font-weight:800}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translate(-50%,-10px);background:rgba(25,16,52,.96);border:2px solid rgba(255,207,110,.55);padding:12px 18px;border-radius:16px;font-size:20px;line-height:1.5;width:max-content;max-width:86vw;text-align:center;opacity:0;transition:.35s;z-index:8;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#whisper{position:fixed;left:0;right:0;top:40%;text-align:center;font-family:var(--serif);font-size:clamp(30px,8vw,48px);color:#fff0c8;opacity:0;pointer-events:none;z-index:4;text-shadow:0 0 30px #ffb347,0 2px 6px #000;transition:opacity 2s ease}
.floatRam{position:fixed;font-family:var(--serif);color:var(--gold);font-size:34px;pointer-events:none;z-index:40;text-shadow:0 0 14px #ffb347;animation:rise 1.6s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-110px) scale(1.3)}}
#heard{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 118px);transform:translateX(-50%);font-size:17px;color:var(--muted);z-index:5;opacity:0;transition:opacity .4s;white-space:nowrap}
/* screens and cards */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(60,30,90,.6),rgba(11,8,32,.94) 70%)}
#title{background-size:cover;background-position:center 30%}
#title h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,13vw,76px);margin:0;color:var(--gold);text-shadow:0 0 40px #ff9d3c88}
#title h2{font-weight:400;font-size:22px;margin:4px 0 18px;color:#ffd9a0}
.shloka{font-family:var(--serif);font-size:22px;line-height:1.75;color:#f3e8ff;max-width:560px;margin:6px 0}
.btn{min-height:58px;padding:12px 28px;border-radius:30px;font-size:22px;background:linear-gradient(135deg,#ffc061,#e9761d);color:#2a1400;font-weight:800;box-shadow:0 6px 26px #ff9d3c55;margin:6px}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--text);border:2px solid rgba(255,207,110,.5);box-shadow:none;font-weight:600}
.btn:active{transform:scale(.96)}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
#modal{z-index:30;background:rgba(6,4,18,.55);backdrop-filter:blur(3px);justify-content:flex-end}
#modal.center{justify-content:center}
.card{width:min(96vw,560px);max-height:88vh;overflow:auto;background:linear-gradient(170deg,#231a4a,#130e2c);border:2px solid rgba(255,207,110,.45);border-radius:24px;padding:22px 20px 18px;box-shadow:0 20px 60px #000c;animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2);text-align:center}
@keyframes cardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.card h3{font-family:var(--serif);font-weight:400;color:var(--gold);font-size:32px;margin:2px 0 8px}
.card .tag{font-size:16px;letter-spacing:1px;color:var(--saffron)}
.card p{line-height:1.7;font-size:22px;margin:10px 0;color:#fff6e6}
.card .msg{font-family:var(--serif);font-size:25px;line-height:1.7;color:#fff;background:rgba(255,207,110,.08);border:2px solid rgba(255,207,110,.3);border-radius:18px;padding:14px 16px;margin:12px 0}
.term{color:#7ff0de;border-bottom:3px dotted #7ff0de;cursor:pointer;padding:0 2px;white-space:nowrap}
.term::after{content:" ⓘ";font-size:.7em}
.darshanPic{width:100%;max-height:34vh;border-radius:18px;overflow:hidden;margin:6px 0 10px;border:2px solid rgba(255,207,110,.5);box-shadow:0 0 40px #ff9d3c55}
.darshanPic img{display:block;width:100%;height:34vh;object-fit:cover;object-position:center 25%;filter:blur(calc((1 - var(--p)) * 14px)) saturate(1.15) contrast(1.08) sepia(.15) brightness(calc(.55 + var(--p) * .5));transform:scale(calc(1.15 - var(--p) * .15));transition:filter .6s,transform .6s}
.gateRam{font-family:var(--serif);font-size:64px;color:var(--gold);text-shadow:0 0 40px #ff9d3c;margin:0}
.gateProg{height:16px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0}
.gateProg>div{height:100%;width:0;background:linear-gradient(90deg,#ffb04a,#ffe08a);transition:width .3s}
.bigNum{font-family:var(--serif);font-size:30px;color:var(--gold)}
.small{font-size:18px;color:var(--muted);line-height:1.6}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-size:20px}
.toggle input[type=checkbox]{width:28px;height:28px;accent-color:var(--saffron)}
input[type=range]{accent-color:var(--saffron);width:150px;height:30px}
#termLayer{z-index:50;background:radial-gradient(ellipse at 50% 30%,rgba(20,70,80,.75),rgba(6,10,24,.97) 70%)}
#termLayer .card{border-color:#7ff0de88}
#termLayer h3{color:#7ff0de;font-size:38px}
.tsec{text-align:left;background:rgba(255,255,255,.05);border-radius:16px;padding:12px 14px;margin:10px 0}
.tsec b{color:#7ff0de;font-size:18px;display:block;margin-bottom:4px}
.tsec span{font-size:22px;line-height:1.65}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.glist button{min-height:54px;font-size:20px;border-radius:14px;background:rgba(127,240,222,.1);border:2px solid rgba(127,240,222,.35)}
.glist button.done{border-color:#ffcf6e}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hudTop" class="hidden">
  <button class="iconBtn" id="menuBtn" aria-label="मेनू">☰</button>
  <div id="lvlTitle"><div class="ch" id="chName">—</div><div class="sub" id="lvlSub">—</div></div>
  <div id="lives"></div>
</div>
<div id="progress" class="hidden"><div id="progFill"></div></div>
<div id="hudBot" class="hidden">
  <div class="tool"><button class="iconBtn" id="micBtn">🎙️</button><span id="micLbl">माइक</span></div>
  <div class="tool"><button class="iconBtn" id="zOut" aria-label="छोटा करें" style="font-size:30px;font-weight:800">－</button><span>छोटा</span></div>
  <div class="tool"><button id="ramBtn">राम<svg viewBox="0 0 98 98"><circle cx="49" cy="49" r="45" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="5"/><circle id="ramArc" cx="49" cy="49" r="45" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283"/></svg></button><span id="japCount">जप ०</span></div>
  <div class="tool"><button class="iconBtn" id="zIn" aria-label="बड़ा करें" style="font-size:30px;font-weight:800">＋</button><span>बड़ा</span></div>
  <div class="tool"><button class="iconBtn" id="hintBtn">🪔</button><span>विवेक</span></div>
</div>
<div id="heard"></div>
<div id="whisper"></div>
<div id="toast"></div>
<div id="title" class="screen">
  <h1>दृग्-दृश्य</h1>
  <h2>तीरों की मुक्ति · भाग २ · जप-यात्रा</h2>
  <div class="shloka">रूपं दृश्यं लोचनं दृक्<br>तद्दृश्यं दृक्तु मानसम्</div>
  <p class="small" style="max-width:520px">रूप दिखता है, आँख देखती है। आँख दिखती है, मन देखता है। मन को जो देखता है — वही आप हैं।</p>
  <div class="row" style="margin-top:14px">
    <button class="btn" id="playBtn">आरम्भ करें</button>
    <button class="btn ghost" id="glossBtn">शब्द-कोश</button>
  </div>
  <p class="small" style="max-width:520px;margin-top:16px">🎙️ "राम" बोलिए, या नीचे का <b style="color:var(--gold)">राम</b> बटन दबाकर रखिए।<br>हर स्तर जप से खुलता है।</p>
</div>
<div id="modal" class="screen hidden"><div class="card" id="card"></div></div>
<div id="termLayer" class="screen hidden"><div class="card" id="termCard"></div></div>
<script>
'use strict';
/* ======================= CONTENT ======================= */
// [[term]] = tappable word that opens its explanation level.
const LESSONS = [
 'जो दिखता है, वह [[दृश्य]] है। जो देखता है, वह [[दृक्]] है। बस इतना याद रखिए।',
 'पेड़ दिखता है, आप देखते हैं। पेड़ दृश्य है, आप दृष्टा हैं।',
 'आँख भी दर्पण में दिखती है। जो दिख सकता है, वह दृश्य है — आँख भी।',
 'आँख धुंधली है या साफ़ — यह मन जानता है। मन आँख को देखता है।',
 'मन उदास है या खुश — यह कौन जानता है? जो जानता है, वह [[साक्षी]] है।',
 'साक्षी सबको देखता है, पर साक्षी को कोई नहीं देखता।',
 'दीया सबको दिखाता है। दीये को देखने के लिए दूसरा दीया नहीं चाहिए।',
 'जो बदलता है, वह दृश्य है। जो हर बदलाव को जानता है, वह नहीं बदलता।',
 'बचपन गया, जवानी गई — पर "मैं हूँ" का भाव वही रहा।',
 'गुस्सा आता है, चला जाता है। आप वहीं रहते हैं। गुस्सा एक [[वृत्ति]] है।',
 'इच्छा, डर, शक, भरोसा, शर्म — ये सब मन की लहरें हैं। ये भी दृश्य हैं।',
 '"मेरा मन" — "मेरा" कहने वाला मन से अलग है।',
 '"मेरा शरीर", "मेरा घर" — जो "मेरा" है, वह "मैं" नहीं।',
 'चेतना [[बुद्धि]] में चमकती है, जैसे सूरज पानी में। इसे [[चिदाभास]] कहते हैं।',
 'पानी हिले तो सूरज हिलता दिखता है। सूरज नहीं हिलता।',
 'मन चंचल हो तो "मैं" भी चंचल लगता है। असली "मैं" शांत है।',
 '[[माया]] के दो काम हैं: सच को ढकना, और झूठ को दिखाना।',
 '[[आवरण]] यानी ढकना। छोटा-सा बादल बड़े सूरज को ढक देता है।',
 '[[विक्षेप]] यानी गलत दिखाना। अँधेरे में रस्सी साँप लगती है।',
 'साँप ने डराया, पर साँप कभी था ही नहीं। रस्सी हमेशा थी।',
 'रस्सी [[अधिष्ठान]] है — वह आधार, जिस पर भ्रम टिका था।',
 'हर चीज़ में पाँच बातें हैं: है, चमकती है, प्यारी है, नाम, और रूप।',
 '"है, चमकती है, प्यारी है" — ये तीन [[अस्ति-भाति-प्रिय]] हैं। ये ईश्वर के हैं।',
 'नाम और रूप बदलते रहते हैं। यही [[नाम-रूप]] संसार है।',
 'कंगन, हार, अँगूठी — नाम-रूप अलग, सोना एक।',
 'लहरें अलग-अलग, पानी एक। रूप अलग-अलग, चेतना एक।',
 'नाम-रूप से नज़र हटाइए, "है-पन" पर टिकिए — यही ध्यान है।',
 '[[समाधि]] का अर्थ है मन का एक ही बात पर टिक जाना।',
 'पहले शब्द के साथ टिकना: "मैं साक्षी हूँ" — यह [[सविकल्प]] समाधि है।',
 'फिर शब्द भी शांत, केवल होना — यह [[निर्विकल्प]] समाधि है।',
 'बाहर भी अभ्यास है: फूल देखिए, फिर उसके "है" को देखिए।',
 '[[जप]] यही करता है: मन "राम" पर टिकता है, बाकी सब दृश्य बनकर गुज़रता है।',
 'सच के तीन स्तर हैं: सपना, जागना, और जो दोनों को जानता है।',
 'सपने का शेर सपने में डराता है, जागते ही मिट जाता है। यह [[प्रातिभासिक]] सच है।',
 'जागते संसार में काम चलता है — रोटी पेट भरती है। यह [[व्यावहारिक]] सच है।',
 'जो कभी नहीं बदलता, वह [[पारमार्थिक]] सच है।',
 'घड़े के अंदर का आकाश और बाहर का आकाश — घड़ा टूटे तो एक ही आकाश।',
 'जो [[आत्मा]] भीतर है, वही [[ब्रह्म]] सब ओर है।',
 '[[नेति-नेति]]: "यह नहीं, यह नहीं।" जो दिखा, छोड़ते जाइए। जो बचा, वही आप।',
 'इस ग्रंथ का नाम [[विवेक]] है — देखने वाले को दिखने वाले से अलग पहचानना।',
 '[[जीव]] अपने को शरीर मानता है, इसलिए डरता है। साक्षी को कोई डर नहीं छूता।',
 '[[अहंकार]] कहता है "मैं कर रहा हूँ"। साक्षी केवल देखता है।',
 'नींद में न शरीर था, न संसार। फिर भी सुबह आप कहते हैं — "अच्छी नींद आई।" किसने जाना?',
];
const SUTRAS = [
 'आँखें बंद कीजिए। अब भी कुछ दिख रहा है — अँधेरा। उसे कौन देख रहा है?',
 'विचार बादल हैं। आप आकाश हैं।',
 'दर्द शरीर में है। दर्द को जानने वाला दर्द में नहीं।',
 'आवाज़ आई, गई। सुनने वाला गया नहीं।',
 'हर तीर जो उड़ा, एक दृश्य था। आप वहीं बैठे रहे।',
 'राम का नाम लेते रहिए। नाम दृश्य है, नाम लेने वाला दृष्टा।',
 'चिंता आए तो पूछिए: यह चिंता किसे दिख रही है?',
 'जो कल था, वह याद है। याद भी दृश्य है।',
 'खुशी भी आती-जाती है। जो उसे देखता है, वह आनंद है।',
 'शरीर बूढ़ा होता है। देखने वाला बूढ़ा नहीं होता।',
 'आईने में चेहरा बदलता है। आईना देखने वाला वही है।',

const Jap = {
  on:false, rec:null, stream:null, raf:0, counted:{}, sid:1,
  RX: /(राम|रामा|ram|raam|rama|राँम)/gi,
  async toggle(){ this.on ? this.stop() : await this.start(); },
  async start(){
    Snd.resume();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR){ try {
      const r = this.rec = new SR(); r.lang = 'hi-IN'; r.continuous = true; r.interimResults = true; this.counted = {};
      r.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++){ const txt = e.results[i][0].transcript, n = (txt.match(this.RX) || []).length, k = this.sid + ':' + i, prev = this.counted[k] || 0;
        if (n > prev){ for (let j = 0; j < n - prev; j++) setTimeout(() => onChant(), j*140); this.counted[k] = n; } showHeard(txt); } };
      r.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){ this.rec = null; this.energy(); } };
      r.onend = () => { if (this.on && this.rec){ this.sid++; try { r.start(); } catch(e){} } };
      r.start(); this.on = true; this.ui(); this.bump(); toast('🎙️ सुन रहा हूँ — "राम" बोलिए'); return;
    } catch(e){ this.rec = null; } }
    this.energy();
  },
  async energy(){
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
      Snd.init(); const an = Snd.c.createAnalyser(); an.fftSize = 1024; Snd.c.createMediaStreamSource(this.stream).connect(an);
      const buf = new Float32Array(an.fftSize); let floor = .01, voiced = false, t0 = 0, off = 0;
      const loop = () => { if (!this.on) return; an.getFloatTimeDomainData(buf); let s = 0; for (const x of buf) s += x*x; const rms = Math.sqrt(s/buf.length), now = performance.now();
        if (!voiced) floor = lerp(floor, rms, .02); const th = Math.max(.02, floor*3.2);
        if (!voiced && rms > th){ voiced = true; t0 = now; } else if (voiced && rms < th*.7){ if (!off) off = now; if (now - off > 120){ const d = off - t0; voiced = false; off = 0; if (d > 160 && d < 1400) onChant(); } } else off = 0;
        this.raf = requestAnimationFrame(loop); };
      this.on = true; this.ui(); this.bump(); loop(); toast('🎙️ हर "राम" साफ़ और अलग बोलें');
    } catch(e){ toast('माइक नहीं मिला — "राम" बटन दबाकर रखें'); this.on = false; this.ui(); }
  },
  stop(){ this.on = false; clearTimeout(this.idle); if (this.rec){ try { this.rec.onend = null; this.rec.stop(); } catch(e){} this.rec = null; }
    if (this.stream){ this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } cancelAnimationFrame(this.raf); this.ui(); },
  bump(){ clearTimeout(this.idle); if (this.on) this.idle = setTimeout(() => { this.stop(); toast('🎙️ माइक बंद — 2 मिनट से जप नहीं सुना'); }, 120000); },
  ui(){ $('micBtn').classList.toggle('on', this.on); $('micLbl').textContent = this.on ? 'सुन रहा' : 'माइक'; }

let heardT = 0;
function showHeard(t){ const h = $('heard'); h.textContent = '"' + t.trim().slice(-30) + '"'; h.style.opacity = .9; clearTimeout(heardT); heardT = setTimeout(() => h.style.opacity = 0, 1800); }
// hold-to-chant button: one Ram per 0.8 s of holding (mindful, not spammy)
function holdToChant(btn, arcEl){
  let held = false, t0 = 0, raf = 0; const C = 283;
  const stop = () => { held = false; cancelAnimationFrame(raf); if (arcEl) arcEl.style.strokeDashoffset = C; else btn.style.backgroundImage = '';
    removeEventListener('pointerup', stop); removeEventListener('pointercancel', stop); removeEventListener('blur', stop); };
  const step = () => {
    if (!held) return;
    if (!btn.isConnected || btn.offsetParent === null || document.hidden){ stop(); return; }   // button gone → stop counting
    const p = clamp((performance.now() - t0) / 800, 0, 1);
    if (arcEl) arcEl.style.strokeDashoffset = C * (1 - p); else btn.style.backgroundImage = `linear-gradient(90deg,#ffffff66 ${p*100}%,transparent ${p*100}%)`;
    if (p >= 1){ onChant(); t0 = performance.now(); if (navigator.vibrate) navigator.vibrate(12); }
    raf = requestAnimationFrame(step); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Snd.resume(); if (held) return; held = true; t0 = performance.now();
    addEventListener('pointerup', stop); addEventListener('pointercancel', stop); addEventListener('blur', stop); step(); });
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* ======================= LEVEL DESIGN ======================= */
function levelSpec(L){
  return {
    L, shape: SHAPES[L % SHAPES.length], darshan: DARSHAN[L % DARSHAN.length],
    target: Math.min(162, 108 + L*3),          // at least 108 arrows — one mala
    lmin: 2, lmax: Math.min(9, 5 + Math.floor(L / 3)), fill: .95,
    veil: L >= 2 ? Math.min(.16, .06 + L*.008) : 0,
    illus: L >= 3 ? Math.min(12, 2 + L) : 0,
    seals: L >= 1 ? Math.min(9, 2 + L) : 0,
    special: 9,
    rotate: L >= 2 && L % 3 === 2, reveil: L >= 4 && L % 3 === 1,
    lives: 3,
  };
}
const PALETTE = ['#ff9f43','#ffc93c','#e8453c','#f78fb3','#a77bf3','#6c7cf5','#2bb5c8','#3ec28f','#ffb37a','#f3e9d2','#ff6b6b','#9be15d'];

function makeLevel(spec){
  // grow the board until it holds at least spec.target arrows
  let best = null;
  for (let W = 16; W <= 36; W++){
    const s = Object.assign({}, spec, { W, H: Math.round(W * 1.42) });
    for (let a = 0; a < 3; a++){
      const lv = tryMake(s, rng(spec.L * 7919 + W * 131 + a * 31 + 7));
      if (!best || lv.total > best.total) best = lv;
      if (lv.total >= spec.target) return lv;
    }
  }
  return best;
}
function tryMake(spec, R){
  let mask0 = Array.from({length:spec.H}, (_, y) => Array.from({length:spec.W}, (_, x) => spec.shape.f((x + .5) / spec.W * 2 - 1, (y + .5) / spec.H * 2 - 1)));
  // crop empty border rows/columns so the shape fills the screen
  let x0 = spec.W, x1 = -1, y0 = spec.H, y1 = -1;
  mask0.forEach((r, y) => r.forEach((m, x) => { if (m){ x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); } }));
  const mask = mask0.slice(y0, y1 + 1).map(r => r.slice(x0, x1 + 1));
  const W = mask[0].length, H = mask.length;
  const occ = Array.from({length:H}, () => Array(W).fill(-1));
  const arrows = [], lv = { W, H, mask, occ, arrows, spec };
  let maskN = 0; mask.forEach(r => r.forEach(m => maskN += m));
  const okCell = (x,y) => x >= 0 && y >= 0 && x < W && y < H && mask[y][x] && occ[y][x] === -1;
  let filled = 0, fails = 0;
  const target = Math.floor(maskN * spec.fill);
  while (filled < target && fails < maskN * 1.2){
    const hx = Math.floor(R()*W), hy = Math.floor(R()*H);
    if (!okCell(hx,hy)){ fails++; continue; }
    let placed = false;

      if (!trace(lv, x, y, dx, dy, -1, true).clear) continue;

      if (!okCell(x, y)) continue;

  for (let i = 0; i < spec.special && si < sh.length; i++){ const a = sh[si++]; a.special = true; a.col = '#ffd97a'; }
  if (spec.veil) real.forEach(a => { if (!a.seal && !a.special && R() < spec.veil) a.veil = true; });

function newArrow(id, cells, dx, dy, col){ return { id, cells, dx, dy, col, alive:true, illusion:false, veil:false, seal:0, anim:null, shake:0, flash:0, fade:1, ph:Math.random()*6.28 }; }

/* ======================= GAME STATE & VIEW ======================= */
const G = { scripts:[], art:null, lv:null, L:0, lives:3, playing:false, focus:-1, parts:[], ripples:[], hintA:-1, hintT:0, whisperT:0, noJap:0,
  twistDone:{}, rotAnim:null, reveal:0, revealAnim:null, gate:null, freed:0 };
const cv = $('cv'), ctx = cv.getContext('2d');
let DPR = 1, VW = 0, VH = 0, cell = 30, ox = 0, oy = 0;
const view = { z:1, px:0, py:0 };
function resize(){ DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW*DPR; cv.height = VH*DPR; layout(); }
function layout(){
  if (!G.lv) return;
  const top = 100, bot = 140, side = 8, aw = VW - side*2, ah = VH - top - bot;
  cell = Math.max(10, Math.floor(Math.min(aw / G.lv.W, ah / G.lv.H)));
  ox = Math.round((VW - cell*G.lv.W) / 2); oy = Math.round(top + (ah - cell*G.lv.H) / 2);
}
addEventListener('resize', resize);
function fitView(){ view.z = 1; view.px = 0; view.py = 0; }
function setZoom(z, cx = VW/2, cy = VH/2){
  z = clamp(z, 1, 4); const k = z / view.z;
  view.px = (view.px + VW/2 - cx) * k - VW/2 + cx; view.py = (view.py + VH/2 - cy) * k - VH/2 + cy; view.z = z; clampPan();
}
function clampPan(){ const mx = VW*(view.z - 1)/2 + 40, my = VH*(view.z - 1)/2 + 40; view.px = clamp(view.px, -mx, mx); view.py = clamp(view.py, -my, my); }
$('zIn').onclick = () => setZoom(view.z * 1.4); $('zOut').onclick = () => { if (view.z / 1.4 <= 1.05) fitView(); else setZoom(view.z / 1.4); };
function toGrid(sx, sy){ const wx = (sx - VW/2 - view.px) / view.z + VW/2, wy = (sy - VH/2 - view.py) / view.z + VH/2; return { x: Math.floor((wx - ox) / cell), y: Math.floor((wy - oy) / cell) }; }
const CX = x => ox + (x + .5)*cell, CY = y => oy + (y + .5)*cell;

/* ======================= INPUT (tap, drag-pan, pinch) ======================= */
const ptrs = new Map(); let pinch0 = null, moved = false, down0 = null;
cv.addEventListener('pointerdown', e => { Snd.resume(); cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1){ moved = false; down0 = {x:e.clientX, y:e.clientY, px:view.px, py:view.py}; }
  if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a.x-b.x, a.y-b.y), z: view.z }; moved = true; } });
cv.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2 && pinch0){ const [a,b] = [...ptrs.values()]; setZoom(pinch0.z * Math.hypot(a.x-b.x, a.y-b.y) / pinch0.d, (a.x+b.x)/2, (a.y+b.y)/2); return; }
  if (down0 && Math.hypot(e.clientX - down0.x, e.clientY - down0.y) > 14){ moved = true; if (view.z > 1.01){ view.px = down0.px + e.clientX - down0.x; view.py = down0.py + e.clientY - down0.y; clampPan(); } } });

['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, up));

function tap(sx, sy){
  if (!G.playing || !G.lv || G.rotAnim) return;
  const g = toGrid(sx, sy), lv = G.lv;

  if (id === -1){ // forgiving tap for older fingers: nearest arrow cell within 0.6 cell
    let best = 1e9;
    for (const a of lv.arrows){ if (!a.alive || a.anim) continue; for (const c of a.cells){ const wx = (sx - VW/2 - view.px)/view.z + VW/2, wy = (sy - VH/2 - view.py)/view.z + VH/2;
      const d = Math.hypot(wx - CX(c.x), wy - CY(c.y)); if (d < cell*.85 && d < best){ best = d; id = a.id; } } }

}
function tapArrow(a){

    loseLife('यह [[विक्षेप]] था — रस्सी में साँप। जो झिलमिलाता है, उस पर भरोसा न करें।'); return; }
  if (a.seal > 0){ G.focus = a.id; a.shake = .4; Snd.soft(); toast('🪷 कमल-बंधन — ' + HN(a.seal) + ' बार "राम" जपिए'); return; }

function launch(a, path){

const ART_CACHE = {};
function loadArt(d){

  if (ART_CACHE[url]) return;
  const img = new Image(); img.decoding = 'async';
  img.onload = () => { const a = ART_CACHE[url] = { img, url, sharp:null, soft:null, key:'' }; if (G.lv && G.lv.spec.darshan === d) G.art = a; };
  img.onerror = () => { ART_CACHE[url] = null; };                       // offline: gradient fallback

function coverFit(c, img, w, h, zoom = 1, fy = .3){

function gradeSharp(img, w, h){

  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'screen'; c.globalAlpha = .35;          // bloom from a blurred copy
  const sm = document.createElement('canvas'); sm.width = Math.max(8, w/16|0); sm.height = Math.max(8, h/16|0);
  sm.getContext('2d').drawImage(cv2, 0, 0, sm.width, sm.height); c.imageSmoothingQuality = 'high'; c.drawImage(sm, 0, 0, w, h);
  c.globalAlpha = 1; c.globalCompositeOperation = 'multiply';

}
function gradeSoft(img, w, h){
  const sm = document.createElement('canvas'); sm.width = 48; sm.height = Math.round(48 * h / w); const s = sm.getContext('2d');
  coverFit(s, img, sm.width, sm.height, 1.15);
  const cv2 = document.createElement('canvas'); cv2.width = w; cv2.height = h; const c = cv2.getContext('2d');
  c.imageSmoothingQuality = 'high'; c.drawImage(sm, 0, 0, w, h);
  c.globalCompositeOperation = 'multiply'; c.fillStyle = '#3a2350'; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'soft-light'; const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#ffb45a'); g.addColorStop(1, '#100828'); c.fillStyle = g; c.fillRect(0, 0, w, h);

function artFor(w, h){

  if (a.key !== key){ try { a.sharp = gradeSharp(a.img, w, h); a.soft = gradeSoft(a.img, Math.max(64, VW/2|0), Math.max(64, VH/2|0)); a.key = key; } catch(e){ return null; } }

/* ======================= RENDERING ======================= */
const motes = Array.from({length:40}, () => ({ x:Math.random(), y:Math.random(), s:.3 + Math.random()*.8, p:Math.random()*6.28 }));
let T = 0;
const SERIF = '"Tiro Devanagari Hindi","Noto Serif Devanagari","Mangal",serif';

function drawBG(dt){
  ctx.fillStyle = '#07051a'; ctx.fillRect(0, 0, VW, VH);
  const a = G.lv ? artFor(Math.round(G.lv.W*cell*DPR), Math.round(G.lv.H*cell*DPR)) : null;
  if (a && a.soft){
    const z = 1.08 + .04*Math.sin(T*.05);                                   // slow Ken Burns drift
    ctx.save(); ctx.globalAlpha = .85; ctx.translate(VW/2 + Math.sin(T*.03)*12, VH/2); ctx.scale(z, z);
    ctx.drawImage(a.soft, -VW/2, -VH/2, VW, VH); ctx.restore();
  } else {
    const g = ctx.createRadialGradient(VW*.5, VH*.35, 10, VW*.5, VH*.5, Math.max(VW,VH)*.85);
    g.addColorStop(0, '#3a1f4a'); g.addColorStop(.6, '#160c2c'); g.addColorStop(1, '#06041a'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }
  // god-rays from above
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (let k = 0; k < 5; k++){ const x = VW*(.15 + k*.18) + Math.sin(T*.07 + k)*30, g = ctx.createLinearGradient(x, 0, x + 80, VH);
    g.addColorStop(0, `rgba(255,200,120,${.07 + .03*Math.sin(T*.3 + k)})`); g.addColorStop(1, 'rgba(255,200,120,0)');

  ctx.restore();
  const v = ctx.createRadialGradient(VW/2, VH/2, Math.min(VW,VH)*.3, VW/2, VH/2, Math.max(VW,VH)*.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(4,2,14,.85)'); ctx.fillStyle = v; ctx.fillRect(0, 0, VW, VH);
  for (const m of motes){ m.y -= dt*.01*m.s; if (m.y < -.05){ m.y = 1.05; m.x = Math.random(); }
    const x = m.x*VW + Math.sin(T*.4 + m.p)*18, y = m.y*VH, r = 6*m.s + 2, rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(255,214,150,${.35 + .25*Math.sin(T + m.p)})`); rg.addColorStop(1, 'rgba(255,190,100,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill(); }
}

function drawBoard(dt){
  const lv = G.lv; if (!lv) return;
  const bw = lv.W*cell, bh = lv.H*cell, cx = ox + bw/2, cy = oy + bh/2;
  ctx.save();
  ctx.translate(VW/2 + view.px, VH/2 + view.py); ctx.scale(view.z, view.z); ctx.translate(-VW/2, -VH/2);
  if (G.rotAnim){ ctx.translate(cx, cy); ctx.rotate(ease(Math.min(1, G.rotAnim.t)) * Math.PI/2); ctx.translate(-cx, -cy); }
  const reveal = G.revealAnim ? ease(Math.min(1, G.revealAnim.t / 1.8)) : 0;

  // the hidden painting, clipped to the sacred shape
  ctx.save(); ctx.beginPath();
  for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++) if (lv.mask[y][x]) ctx.rect(ox + x*cell - .4, oy + y*cell - .4, cell + .8, cell + .8);
  ctx.clip();
  const a = artFor(Math.round(bw*DPR), Math.round(bh*DPR));
  if (a && a.sharp){ const z = 1 + reveal*.05; ctx.drawImage(a.sharp, cx - bw*z/2, cy - bh*z/2, bw*z, bh*z); }
  else { const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(bw, bh)*.7); hg.addColorStop(0, '#5a3010'); hg.addColorStop(1, '#160a24'); ctx.fillStyle = hg; ctx.fillRect(ox, oy, bw, bh); }
  // veil over still-covered cells
  for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++){
    if (!lv.mask[y][x]) continue;
    const c = lv.coverA[y][x] += (lv.cover[y][x] - lv.coverA[y][x]) * Math.min(1, dt*2.5);
    const al = (.42 + .5*c) * (1 - reveal); if (al < .01) continue;

    ctx.font = `${Math.floor(Math.min(VW*.055, 26))}px ${SERIF}`; ctx.fillStyle = '#ffd99a'; ctx.fillText(d.line, VW/2, y + 46);

}
function hexA(h, a){ const n = parseInt(h.slice(1), 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

  // glow for special / hint
  if (a.special || hint){ ctx.shadowColor = hint ? '#ffffff' : '#ffcf6e'; ctx.shadowBlur = (hint ? 22 : 10) * (.7 + .3*Math.sin(T*3 + a.ph)); }
  const g = ctx.createLinearGradient(P[0].x, P[0].y, P[P.length-1].x, P[P.length-1].y);
  g.addColorStop(0, shade(col.startsWith('#') ? col : '#ff5050', .55)); g.addColorStop(1, col);
  ctx.strokeStyle = g; ctx.lineWidth = w; poly(P); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = Math.max(.8, w*.22);           // specular line
  ctx.beginPath(); ctx.moveTo(P[0].x - w*.12, P[0].y - w*.12); for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x - w*.12, P[i].y - w*.12); ctx.stroke();
  head(P, w, col);
  if (a.special && !(a.anim && a.anim.type === 'fly')){                  // a single golden bead at the tail
    ctx.fillStyle = '#fff3c8'; ctx.shadowColor = '#ffcf6e'; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(P[0].x, P[0].y, w*.5, 0, 6.29); ctx.fill(); ctx.shadowBlur = 0; }
  if (a.seal > 0 && !(a.anim && a.anim.type === 'fly')){                 // lotus knot with one bead per pending "Ram"
    const m = P[Math.floor((P.length-1)/2)], rr = Math.max(6, cell*.42), on = G.focus === a.id;
    ctx.fillStyle = on ? '#ffb3c8' : '#f7c6d4'; ctx.shadowColor = '#ff9db5'; ctx.shadowBlur = on ? 16 : 6;
    for (let k = 0; k < 8; k++){ const an = k/8*6.283 + T*.25; ctx.beginPath(); ctx.ellipse(m.x + Math.cos(an)*rr*.42, m.y + Math.sin(an)*rr*.42, rr*.4, rr*.17, an, 0, 6.29); ctx.fill(); }
    ctx.shadowBlur = 0; ctx.fillStyle = '#5a1630'; ctx.beginPath(); ctx.arc(m.x, m.y, rr*.32, 0, 6.29); ctx.fill();
    for (let k = 0; k < a.seal; k++){ const an = k/a.seal*6.283 - Math.PI/2; ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(m.x + Math.cos(an)*rr*.82, m.y + Math.sin(an)*rr*.82, Math.max(1.3, rr*.11), 0, 6.29); ctx.fill(); }
  }
  ctx.restore();
}
function poly(P){ ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y); for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y); ctx.stroke(); }
function head(P, w, col){ const h = P[P.length-1]; let p = P[P.length-2]; for (let i = P.length-2; i >= 0 && Math.hypot(h.x-P[i].x, h.y-P[i].y) < 1; i--) p = P[i];
  const ang = Math.atan2(h.y - p.y, h.x - p.x), s = w*1.35; ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(s*1.1, 0); ctx.lineTo(-s*.45, -s*.8); ctx.quadraticCurveTo(-s*.1, 0, -s*.45, s*.8); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.restore(); }

// cursive राम that writes itself as a golden arrow leaves the board
function drawScripts(dt){
  for (let i = G.scripts.length - 1; i >= 0; i--){
    const s = G.scripts[i]; s.t += dt; if (s.t > 3.4){ G.scripts.splice(i, 1); continue; }
    const wx = CX(s.gx), wy = CY(s.gy);
    let x = (wx - VW/2) * view.z + VW/2 + view.px, y = (wy - VH/2) * view.z + VH/2 + view.py;
    const size = Math.min(78, VW*.18);
    x = clamp(x, size*1.2, VW - size*1.2); y = clamp(y, 150, VH - 190) - s.t*22;
    const write = clamp(s.t / 1.1, 0, 1), fade = s.t < 2.4 ? 1 : 1 - (s.t - 2.4);
    ctx.save(); ctx.globalAlpha = fade; ctx.translate(x, y); ctx.transform(1, 0, -.28, 1, 0, 0); ctx.rotate(-.06);
    ctx.font = `${size}px ${SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText('राम').width;
    ctx.beginPath(); ctx.rect(-tw/2 - 10, -size, (tw + 20) * ease(write), size*2); ctx.clip();          // pen reveal, left to right
    const g = ctx.createLinearGradient(-tw/2, -size/2, tw/2, size/2); g.addColorStop(0, '#fff6d6'); g.addColorStop(.5, '#ffcf6e'); g.addColorStop(1, '#ff9d3c');
    ctx.shadowColor = '#ff9d3c'; ctx.shadowBlur = 24; ctx.fillStyle = g; ctx.fillText('राम', 0, 0);
    ctx.shadowBlur = 0; ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(80,30,0,.5)'; ctx.strokeText('राम', 0, 0);
    ctx.restore();
  }
}
function drawParticles(dt){
  for (let i = G.parts.length - 1; i >= 0; i--){ const p = G.parts[i]; p.t += dt; if (p.t > p.life){ G.parts.splice(i, 1); continue; }
    p.vy += 40*dt; p.vx *= .99; p.x += p.vx*dt; p.y += p.vy*dt; ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle = p.c;
    if (p.petal){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t*3); ctx.beginPath(); ctx.ellipse(0, 0, 9, 4, 0, 0, 6.29); ctx.fill(); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, 6.29); ctx.fill(); } }
  ctx.globalAlpha = 1;
}

/* ======================= MAIN LOOP ======================= */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; T += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBG(dt);
  if (G.lv){
    for (const a of G.lv.arrows){
      if (a.shake > 0) a.shake = Math.max(0, a.shake - dt*1.8);
      if (a.flash > 0) a.flash = Math.max(0, a.flash - dt*1.4);
      if (a.anim){
        if (a.anim.type === 'fly'){ a.anim.s += dt*(18 + a.anim.s*3); if (a.anim.s > a.anim.pts.length){ a.anim = null; a.fade = 0; } }
        else if (a.anim.type === 'bump'){ a.anim.t += dt; if (a.anim.t > .45) a.anim = null; }
        else if (a.anim.type === 'dissolve'){ a.anim.t += dt; a.fade = Math.max(0, 1 - a.anim.t/1.2); if (a.anim.t > 1.2){ a.anim = null; a.fade = 0; } }
      }
    }
    for (let i = G.ripples.length - 1; i >= 0; i--){ G.ripples[i].t += dt; if (G.ripples[i].t > .9) G.ripples.splice(i, 1); }
    if (G.hintT > 0) G.hintT -= dt;
    if (G.rotAnim){ G.rotAnim.t += dt/1.3; if (G.rotAnim.t >= 1){ G.rotAnim = null; rotateLevel(G.lv); layout(); } }
    if (G.revealAnim) G.revealAnim.t += dt;
    drawBoard(dt);
    drawScripts(dt);
    if (G.playing){ G.whisperT -= dt; if (G.whisperT <= 0){ whisper(); G.whisperT = 40 + Math.random()*25; }
      G.noJap += dt; if (G.noJap > 120){ G.noJap = 0; toast('📿 एक बार "राम" — फिर आगे'); } }
  }
  drawParticles(dt);
  requestAnimationFrame(frame);
}

/* ======================= START ======================= */
$('playBtn').textContent = Save.d.level > 0 ? 'जारी रखें · स्तर ' + HN(Save.d.level + 1) : 'आरम्भ करें';

  Snd.resume(); $('title').classList.add('hidden'); hud(true);

    <p>हर स्तर में १०८ से अधिक तीर हैं — एक माला। हर तीर एक घंटी। हर स्तर के बाद <b>जप-द्वार</b>।</p>
    <p class="small">तीर छोटे हैं: ＋ बटन या दो उँगलियों से बोर्ड बड़ा कीजिए।</p>
    <div class="row"><button class="btn ghost" id="mOn">🎙️ माइक चालू</button><button class="btn" id="mGo">चलें</button></div>`, true);
  $('mOn').onclick = () => { Jap.start(); $('mOn').textContent = '🎙️ चालू'; };
  $('mGo').onclick = () => { closeModal(); introLevel(Save.d.level); };
};
$('glossBtn').onclick = () => { Snd.resume(); showGlossary(); };
// title screen: a real painting behind the title
(() => { const d = DARSHAN[0]; $('title').style.backgroundImage = `radial-gradient(ellipse at 50% 35%,rgba(40,20,60,.55),rgba(8,5,22,.94) 72%),url("${imgURL(d.f)}")`; })();
resize();
requestAnimationFrame(frame);
window.__G = G; window.__make = makeLevel; window.__spec = levelSpec; window.__trace = trace; window.__rot = rotateLevel;
